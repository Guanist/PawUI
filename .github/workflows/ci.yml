name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # PySide6 6.11 的 macOS cp312 轮子在 offscreen 平台下会在
          # QApplication::setStyleSheet 里直接段错误（Qt 内部崩，调用栈全在 Qt 里）。
          # 同代码在 macOS 3.10/3.11、Linux/Windows 3.12 都正常 —— 属于轮子问题，
          # 等 PySide6 更新后把这条 exclude 删掉即可。3.12 仍由另外两个平台覆盖。
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PySide6 在 ubuntu runner 上要这几个系统库，缺了就 ImportError: libEGL.so.1
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Types (mypy)
        run: python -m mypy pawui
      - name: Tests (offscreen, no display)
        # Qt 的 offscreen 后端偶发在 pytest-qt 处理事件时进程级段错误
        # （崩溃栈里没有 Python 帧，Windows/macOS/Linux 都撞到过，无法 try/except）。
        # 失败重试一次：真坏了两次都会挂，偶发的话重试就过。
        run: |
          python -m pytest -q || (echo "::warning::第一次 pytest 挂了，重试一次" && python -m pytest -q)
        env:
          QT_QPA_PLATFORM: offscreen
      # 回归防线：stdout 被管道捕获时不能再抛 UnicodeEncodeError
      - name: CLI smoke (piped stdout)
        run: python -m pawui check app.paw
        env:
          QT_QPA_PLATFORM: offscreen
