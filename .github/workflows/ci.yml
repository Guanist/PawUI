name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Types (mypy)
        run: python -m mypy pawui
      - name: Tests (offscreen, no display)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      # 回归防线：stdout 被管道捕获时不能再抛 UnicodeEncodeError
      - name: CLI smoke (piped stdout)
        run: python -m pawui check app.paw
        env:
          QT_QPA_PLATFORM: offscreen

