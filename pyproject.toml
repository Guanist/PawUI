[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pawui"
version = "0.1.3.2"
description = "轻量、直接运行的 Python 声明式 UI 层"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://pawui.pages.dev"
Documentation = "https://pawui.pages.dev/docs/"
Repository = "https://github.com/LK-BLOG/PawUI"
Changelog = "https://github.com/LK-BLOG/PawUI/blob/main/CHANGELOG.md"
Issues = "https://github.com/LK-BLOG/PawUI/issues"

[project.scripts]
pawui = "pawui.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=4.0",
]
web = ["PySide6-Addons"]

[tool.setuptools.packages.find]
include = ["pawui*"]

[tool.setuptools.package-data]
pawui = ["py.typed"]

[tool.setuptools.data-files]
"share/pawui/docs" = ["docs/*.md"]
"share/pawui/docs/zh" = ["docs/zh/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
